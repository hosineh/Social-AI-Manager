
name: Extract Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -oq SocialAIManager_Full_Starter.zip -d extracted
          cp -a extracted/SocialAIManager_Full_Starter/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app backend build.gradle.kts settings.gradle.kts gradle.properties README_AR.md DEPLOY_FROM_ANDROID_AR.md
          git diff --cached --quiet || git commit -m "Add Android app and backend source"
          git push origin HEAD:main
